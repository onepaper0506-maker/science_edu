<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몸속 탐험실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#213e3a;font-family:system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px}button,select{font:inherit;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:#e5e9df;color:#213e3a}button.active,button.primary{background:#276658;color:white}.hero{padding:24px 0}h2{font-size:42px;margin:10px 0}p{line-height:1.7;color:#61726c}.tabs{display:flex;gap:12px;margin:20px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}.card{background:white;border-radius:26px;padding:26px;box-shadow:0 8px 28px #203e3810}.stage{background:#eaf2ec;border-radius:20px;position:relative;overflow:hidden;min-height:390px;display:grid;place-items:center;perspective:800px}.model{transform-style:preserve-3d;transition:transform .2s;width:310px;height:320px;position:relative}.lung{position:absolute;top:65px;width:118px;height:180px;background:radial-gradient(at 30% 25%,#ffb9aa,#d97278);border-radius:65% 40% 40% 35%;box-shadow:inset -18px -10px 30px #a34a6b55,12px 10px 20px #284c3422;transition:transform .2s}.left{left:25px}.right{right:25px;transform:scaleX(-1)}.tube{position:absolute;left:146px;top:0;width:18px;height:120px;background:#e9bd91;border-radius:12px}.diaphragm{position:absolute;bottom:20px;left:20px;width:270px;height:48px;background:#d9a158;border-radius:90% 90% 20% 20%;transition:all .2s}.kidney{position:absolute;left:60px;top:35px;width:190px;height:230px;border-radius:65% 35% 60% 45%;background:radial-gradient(at 30% 25%,#f4b2a5,#b95364);box-shadow:inset -20px -15px 30px #76264155}.nephron{position:absolute;left:110px;top:65px;font-size:95px;color:#ffeb9f}.drop{position:absolute;left:150px;top:230px;font-size:38px;color:#e8bd49}.badge{position:absolute;top:18px;left:18px;background:white;padding:8px 14px;border-radius:20px;font-size:12px}.controls{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}input{accent-color:#276658;width:100%;margin:16px 0}label{display:block;margin-top:18px;font-weight:650}.stat{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #eee}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.step{background:#f0f3ed;padding:18px;border-radius:16px;font-size:14px}.step.on{background:#d4e8bd;outline:2px solid #80a96d}.note{background:#fff2d4;padding:18px;border-radius:16px;margin-top:20px;font-size:14px}footer{padding:24px;text-align:center;color:#718077;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}h2{font-size:30px}.steps{grid-template-columns:1fr}header{padding:12px} }
</style><header><h1>🌱 몸속 탐험실</h1><span>중학교 과학 · 우리 몸의 시스템</span></header><main><div class="hero"><small>직접 움직이며 이해하는 과학</small><h2>눈에 보이지 않던 몸속 이야기</h2><p>숨 한 번, 물 한 잔이 우리 몸에서 어떤 변화를 만들까요?</p></div><div class="tabs"><button id="resp" class="active" onclick="switchMode('resp')">🫁 호흡 운동</button><button id="urine" onclick="switchMode('urine')">💧 오줌 생성</button></div><div class="grid"><section class="card"><h3 id="title"></h3><div class="stage"><span class="badge">입체 개념 모형 · 슬라이더로 회전</span><div class="model" id="model"></div></div><div class="controls"><button class="primary" id="play" onclick="playing=!playing;render()">⏸ 일시 정지</button><button onclick="phase=0;playing=false;render()">↺ 처음부터</button><span id="phaseName"></span></div><label>관찰 각도 <input id="angle" aria-label="관찰 각도" type="range" min="-65" max="65" value="0" oninput="document.getElementById('model').style.transform='rotateY('+this.value+'deg)' "></label><div class="steps" id="steps"></div></section><aside class="card"><h3>🎛 실험 조건 바꾸기</h3><label>상황 선택</label><select id="scenario" onchange="scenarioChange()"></select><label id="sliderLabel"></label><input id="amount" type="range" min="1" max="3" step="1" value="1" oninput="render()"><div id="stats"></div><div class="note" id="explain"></div><p style="font-size:13px">💬 함께 생각하기<br><span id="question"></span></p><button onclick="document.getElementById('answer').hidden=!document.getElementById('answer').hidden">설명 확인하기</button><p id="answer" hidden></p></aside></div><footer>학습을 위한 단순화된 입체 개념 모형입니다. 실제 장기의 크기·형태·속도와 다르며, 수치는 의학적 예측값이 아닙니다.</footer></main><script>
let mode='resp',phase=0,playing=true;const $=id=>document.getElementById(id);function switchMode(m){mode=m;phase=0;$('resp').classList.toggle('active',m==='resp');$('urine').classList.toggle('active',m==='urine');$('scenario').innerHTML=(m==='resp'?['편안히 쉬기','운동하기']:['평소 수분 섭취','물을 많이 마신 뒤','땀을 많이 흘린 뒤']).map(x=>'<option>'+x+'</option>').join('');$('amount').value=1;$('answer').hidden=true;render()}function scenarioChange(){$('amount').value=mode==='resp'?($('scenario').selectedIndex?3:1):[2,3,1][$('scenario').selectedIndex];render()}function render(){let r=mode==='resp',v=+$('amount').value,inhale=phase<1.5,step=Math.floor(phase)%3;$('title').textContent=r?'01 / 공기는 어떻게 폐로 들어올까?':'02 / 혈액에서 오줌이 만들어지기까지';$('play').textContent=playing?'⏸ 일시 정지':'▶ 재생';$('sliderLabel').textContent=r?'호흡 빠르기 · '+['느리게','보통','빠르게'][v-1]:'몸의 수분 상태 · '+['부족','보통','충분'][v-1];$('phaseName').textContent=r?(inhale?'들이쉬는 중':'내쉬는 중'):['① 여과','② 재흡수','③ 분비'][step];$('model').innerHTML=r?'<div class="tube"></div><div class="lung left"></div><div class="lung right"></div><div class="diaphragm"></div>':'<div class="kidney"></div><div class="nephron">♧</div><div class="drop">💧</div>';if(r){let scale=inhale?1.1:.9;document.querySelector('.left').style.transform='scale('+scale+')';document.querySelector('.right').style.transform='scale('+(-scale)+','+scale+')';document.querySelector('.diaphragm').style.bottom=inhale?'0px':'25px'}let names=r?['횡격막과 갈비뼈','가슴우리 부피와 압력','공기의 이동']:['여과 · 사구체 → 보먼주머니','재흡수 · 세뇨관 → 모세혈관','분비 · 모세혈관 → 세뇨관'];let desc=r?(inhale?['횡격막 수축·하강, 갈비뼈 상승','부피 증가 → 폐 속 압력 감소','바깥 공기가 폐 안으로 이동']:['횡격막 이완·상승, 갈비뼈 하강','부피 감소 → 폐 속 압력 증가','폐 속 공기가 밖으로 이동']):['물·포도당·요소 등 작은 물질이 걸러져요. 혈구와 대부분의 단백질은 혈액에 남아요.','포도당과 필요한 물·무기 염류가 혈액으로 돌아가요.','일부 노폐물과 이온이 세뇨관으로 이동해요. 이후 집합관을 거쳐 오줌이 이동해요.'];$('steps').innerHTML=names.map((x,i)=>'<div class="step '+(r||i===step?'on':'')+'"><b>'+x+'</b><p>'+desc[i]+'</p></div>').join('');$('stats').innerHTML=(r?[['횡격막',inhale?'수축 ↓':'이완 ↑'],['가슴우리 부피',inhale?'증가':'감소'],['폐 속 압력',inhale?'대기압보다 낮음':'대기압보다 높음']]:[['물의 재흡수',v===1?'증가':v===3?'감소':'보통'],['최종 오줌 양',v===1?'감소':v===3?'증가':'보통'],['오줌 농도',v===1?'진해짐':v===3?'묽어짐':'보통']]).map(a=>'<div class="stat"><span>'+a[0]+'</span><b>'+a[1]+'</b></div>').join('');$('explain').textContent=r?'폐는 스스로 근육처럼 수축하지 않아요. 호흡 근육이 가슴우리의 부피를 바꾸면 압력 차이 때문에 공기가 이동해요.':'세 과정은 실제 콩팥에서 동시에 일어납니다. 여기서는 이해를 위해 순서대로 강조해요. 수분 상태는 물의 재흡수와 최종 오줌에 영향을 줍니다.';$('question').textContent=r?'운동할 때 호흡이 빨라지면 어떤 점이 유리할까요?':'땀을 많이 흘리면 오줌 양은 왜 줄어들까요?';$('answer').textContent=r?'근육에 필요한 산소를 더 공급하고, 세포 호흡으로 생긴 이산화 탄소를 더 배출할 수 있어요.':'몸의 물을 보존하기 위해 물의 재흡수가 늘어나므로 오줌 양이 줄고 농도가 진해져요.'}setInterval(()=>{if(playing){phase=(phase+.1*(mode==='resp'?+$('amount').value:1))%3;render()}},180);switchMode('resp');
</script></html>
