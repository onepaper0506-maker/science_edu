<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몸속 탐험실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#213e3a;font-family:system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px}button,select{font:inherit;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:#e5e9df;color:#213e3a}button.active,button.primary{background:#276658;color:white}.hero{padding:24px 0}h2{font-size:42px;margin:10px 0}p{line-height:1.7;color:#61726c}.tabs{display:flex;gap:12px;margin:20px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}.card{background:white;border-radius:26px;padding:26px;box-shadow:0 8px 28px #203e3810}.stage{background:#eaf2ec;border-radius:20px;position:relative;overflow:hidden;min-height:390px;display:grid;place-items:center;perspective:800px}.model{transform-style:preserve-3d;transition:transform .2s;width:310px;height:320px;position:relative}.lung{position:absolute;top:65px;width:118px;height:180px;background:radial-gradient(at 30% 25%,#ffb9aa,#d97278);border-radius:65% 40% 40% 35%;box-shadow:inset -18px -10px 30px #a34a6b55,12px 10px 20px #284c3422;transition:transform .2s}.left{left:25px}.right{right:25px;transform:scaleX(-1)}.tube{position:absolute;left:146px;top:0;width:18px;height:120px;background:#e9bd91;border-radius:12px}.diaphragm{position:absolute;bottom:20px;left:20px;width:270px;height:48px;background:#d9a158;border-radius:90% 90% 20% 20%;transition:all .2s}.kidney{position:absolute;left:60px;top:35px;width:190px;height:230px;border-radius:65% 35% 60% 45%;background:radial-gradient(at 30% 25%,#f4b2a5,#b95364);box-shadow:inset -20px -15px 30px #76264155}.nephron{position:absolute;left:110px;top:65px;font-size:95px;color:#ffeb9f}.drop{position:absolute;left:150px;top:230px;font-size:38px;color:#e8bd49}.badge{position:absolute;top:18px;left:18px;background:white;padding:8px 14px;border-radius:20px;font-size:12px}.controls{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}input{accent-color:#276658;width:100%;margin:16px 0}label{display:block;margin-top:18px;font-weight:650}.stat{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #eee}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.step{background:#f0f3ed;padding:18px;border-radius:16px;font-size:14px}.step.on{background:#d4e8bd;outline:2px solid #80a96d}.note{background:#fff2d4;padding:18px;border-radius:16px;margin-top:20px;font-size:14px}footer{padding:24px;text-align:center;color:#718077;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}h2{font-size:30px}.steps{grid-template-columns:1fr}header{padding:12px} }

.model{width:100%;height:440px;max-width:560px}.stage{min-height:460px;background:radial-gradient(ellipse at center,#fafffa,#dce9e2)}.model svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(8px 14px 10px #294f3a25)}.particle{animation:flow 2s linear infinite;offset-rotate:0deg}@keyframes flow{from{offset-distance:0%}to{offset-distance:100%}}svg text{font-family:system-ui,sans-serif;font-size:13px;fill:#284b43}.legend{font-size:12px}button:focus-visible{outline:3px solid #c58d2a;outline-offset:3px}@media(prefers-reduced-motion:reduce){.particle{animation:none;offset-distance:50%}}
</style><header><h1>🌱 몸속 탐험실</h1><span>중학교 과학 · 우리 몸의 시스템</span></header><main><div class="hero"><small>직접 움직이며 이해하는 과학</small><h2>눈에 보이지 않던 몸속 이야기</h2><p>숨 한 번, 물 한 잔이 우리 몸에서 어떤 변화를 만들까요?</p></div><div class="tabs"><button id="resp" class="active" onclick="switchMode('resp')">🫁 호흡 운동</button><button id="urine" onclick="switchMode('urine')">💧 오줌 생성</button></div><div class="grid"><section class="card"><h3 id="title"></h3><div class="stage"><span class="badge">인체 구조 모형 · 아래에서 회전 조절</span><div class="model" id="model"></div></div><div class="controls" id="manual"></div><div class="controls"><button class="primary" id="play" onclick="playing=!playing;render()">⏸ 일시 정지</button><button onclick="phase=0;playing=false;render()">↺ 처음부터</button><span id="phaseName"></span></div><label>관찰 각도 <input id="angle" aria-label="관찰 각도" type="range" min="-65" max="65" value="0" oninput="document.getElementById('model').style.transform='rotateY('+this.value+'deg)' "></label><div class="steps" id="steps"></div></section><aside class="card"><h3>🎛 실험 조건 바꾸기</h3><label>상황 선택</label><select id="scenario" onchange="scenarioChange()"></select><label id="sliderLabel"></label><input id="amount" type="range" min="1" max="3" step="1" value="1" oninput="render()"><div id="stats"></div><div class="note" id="explain"></div><p style="font-size:13px">💬 함께 생각하기<br><span id="question"></span></p><button onclick="document.getElementById('answer').hidden=!document.getElementById('answer').hidden">설명 확인하기</button><p id="answer" hidden></p></aside></div><footer>학습을 위한 단순화된 입체 개념 모형입니다. 실제 장기의 크기·형태·속도와 다르며, 수치는 의학적 예측값이 아닙니다.</footer></main><script>
function defs(){return `<defs><radialGradient id="skin" cx="35%" cy="25%"><stop stop-color="#fff2db" stop-opacity=".65"/><stop offset="1" stop-color="#c59d79" stop-opacity=".4"/></radialGradient><radialGradient id="lung"><stop stop-color="#ffcec0"/><stop offset=".65" stop-color="#ed9694"/><stop offset="1" stop-color="#ae576e"/></radialGradient><radialGradient id="renal"><stop stop-color="#edb4a5"/><stop offset="1" stop-color="#a44c64"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#287f8b"/></marker></defs>`}
function respModel(inhale){let dy=inhale?20:0;return `<svg viewBox="0 0 560 440" role="img" aria-label="${inhale?' 들숨: 횡격막 수축, 폐 팽창':'날숨: 횡격막 이완, 폐 수축'} 인체 모형">${defs()}<path d="M227 12L227 48Q185 50 150 82Q122 110 130 180L144 390Q280 429 416 390L430 180Q438 110 410 82Q375 50 333 48L333 12" fill="url(#skin)" stroke="#b7a58d" stroke-width="2"/><path d="M280 24V143M280 133L235 174M280 133L325 174" fill="none" stroke="#cead87" stroke-width="20" stroke-linecap="round"/><g transform="translate(280 240) scale(${inhale?1.06:.89}) translate(-280 -240)"><path d="M260 138C226 105 174 128 161 220S169 330 254 326Z" fill="url(#lung)" stroke="#b96678"/><path d="M300 138C334 105 386 128 399 220S391 330 306 326Z" fill="url(#lung)" stroke="#b96678"/><path d="M244 166L210 198L194 252M210 198L239 253M316 166L350 198L366 252M350 198L321 253" fill="none" stroke="#f8d3b3" stroke-width="7" stroke-linecap="round"/></g><g fill="none" stroke="#fff8e5" stroke-width="5" opacity=".65">${[0,1,2,3,4,5].map(i=>`<path d="M275 ${136+i*30}Q180 ${120+i*30} 149 ${164+i*29}M285 ${136+i*30}Q380 ${120+i*30} 411 ${164+i*29}"/>`).join('')}</g><path d="M151 ${358+dy}Q280 ${inhale?335:275} 409 ${358+dy}L409 ${374+dy}Q280 ${inhale?350:292} 151 ${374+dy}Z" fill="#c68c43" stroke="#9e692e" stroke-width="2"/><path d="M280 ${inhale?40:117}V${inhale?117:40}" stroke="#287f8b" stroke-width="5" marker-end="url(#arrow)"/><text x="25" y="60">공기 ${inhale?'유입 ↓':'배출 ↑'}</text><text x="434" y="166">갈비뼈</text><text x="434" y="188">${inhale?'위·바깥쪽':'아래·안쪽'}</text><text x="30" y="282">폐 ${inhale?'팽창':'축소'}</text><text x="195" y="426">횡격막 ${inhale?'수축 · 하강 ↓':'이완 · 상승 ↑'}</text></svg>`}
function kidneyModel(step){const paths=['M122 139 Q165 139 205 140','M299 219 Q330 219 368 219','M368 285 Q335 285 303 285'];const col=['#d9a72d','#2c9cad','#9960ac'][step];return `<svg viewBox="0 0 560 440" role="img" aria-label="네프론의 ${['여과','재흡수','분비'][step]} 물질 이동 모형">${defs()}<path d="M25 42Q94 6 108 58Q81 85 111 112Q101 167 35 137Q2 103 25 42" fill="url(#renal)"/><text x="25" y="188">콩팥</text><path d="M108 85L171 50" stroke="#879c8a" stroke-dasharray="4 4"/><rect x="165" y="18" width="381" height="381" rx="25" fill="#ffffffb0" stroke="#b8d0bc"/><text x="180" y="43">확대해서 보는 네프론</text><path d="M82 116H119Q178 98 166 141T117 155H80" fill="none" stroke="#c66c78" stroke-width="14"/><path d="M141 101C177 77 208 107 208 137S178 198 143 174" fill="none" stroke="#d5b15f" stroke-width="9"/><path d="M204 151Q270 147 254 188T287 222L287 319Q310 366 330 319L330 178Q341 154 354 180L354 329Q363 356 401 351L426 351V389" fill="none" stroke="#d6b76f" stroke-width="16"/><path d="M179 108Q386 75 383 170L383 326Q383 375 449 366" fill="none" stroke="#83b0b7" stroke-width="10"/><path d="${paths[step]}" fill="none" stroke="${col}" stroke-width="5" marker-end="url(#arrow)"/>${[0,1,2,3].map(i=>`<circle r="5" fill="${col}" class="particle" style="offset-path:path('${paths[step]}');animation-delay:-${i*.5}s"/>`).join('')}<text x="68" y="93">사구체</text><text x="173" y="211">보먼주머니</text><text x="218" y="303">세뇨관</text><text x="393" y="246">모세혈관</text><text x="410" y="417">집합관 → 오줌</text><rect x="20" y="309" width="160" height="106" rx="14" fill="#fff"/><text x="32" y="334" font-weight="bold">${['① 여과','② 재흡수','③ 분비'][step]}</text><text x="32" y="359">${['물 · 포도당 · 요소','포도당 · 물 · 무기 염류','일부 노폐물 · 이온'][step]}</text><text x="32" y="384">${['혈액 → 보먼주머니','세뇨관 → 혈액','혈액 → 세뇨관'][step]}</text></svg>`}
let mode='resp' ,phase=0,playing=true;const $=id=>document.getElementById(id);function switchMode(m){mode=m;phase=0;$('resp').classList.toggle('active',m==='resp');$('urine').classList.toggle('active',m==='urine');$('scenario').innerHTML=(m==='resp'?['편안히 쉬기','운동하기']:['평소 수분 섭취','물을 많이 마신 뒤','땀을 많이 흘린 뒤']).map(x=>'<option>'+x+'</option>').join('');$('amount').value=1;$('answer').hidden=true;render()}function scenarioChange(){$('amount').value=mode==='resp'?($('scenario').selectedIndex?3:1):[2,3,1][$('scenario').selectedIndex];render()}function render(){let r=mode==='resp',v=+$('amount').value,inhale=phase<1.5,step=Math.floor(phase)%3;$('title').textContent=r?'01 / 공기는 어떻게 폐로 들어올까?':'02 / 혈액에서 오줌이 만들어지기까지';$('play').textContent=playing?'⏸ 일시 정지':'▶ 재생';$('sliderLabel').textContent=r?'호흡 빠르기 · '+['느리게','보통','빠르게'][v-1]:'몸의 수분 상태 · '+['부족','보통','충분'][v-1];$('manual').innerHTML=(r?['들이쉬기 · 들숨','내쉬기 · 날숨']:['① 여과','② 재흡수','③ 분비']).map((n,i)=>'<button class="'+((r?(inhale?0:1):step)===i?'active':'')+'" onclick="playing=false;phase='+(r?i*1.5:i)+';render()">'+n+'</button>').join('');$('phaseName').textContent=r?(inhale?'들이쉬는 중':'내쉬는 중'):['① 여과','② 재흡수','③ 분비'][step];$('model').innerHTML=r?respModel(inhale):kidneyModel(step);let names=r?['횡격막과 갈비뼈','가슴우리 부피와 압력','공기의 이동']:['여과 · 사구체 → 보먼주머니','재흡수 · 세뇨관 → 모세혈관','분비 · 모세혈관 → 세뇨관'];let desc=r?(inhale?['횡격막 수축·하강, 갈비뼈 상승','부피 증가 → 폐 속 압력 감소','바깥 공기가 폐 안으로 이동']:['횡격막 이완·상승, 갈비뼈 하강','부피 감소 → 폐 속 압력 증가','폐 속 공기가 밖으로 이동']):['물·포도당·요소 등 작은 물질이 걸러져요. 혈구와 대부분의 단백질은 혈액에 남아요.','포도당과 필요한 물·무기 염류가 혈액으로 돌아가요.','일부 노폐물과 이온이 세뇨관으로 이동해요. 이후 집합관을 거쳐 오줌이 이동해요.'];$('steps').innerHTML=names.map((x,i)=>'<div class="step '+(r||i===step?'on':'')+'"><b>'+x+'</b><p>'+desc[i]+'</p></div>').join('');$('stats').innerHTML=(r?[['횡격막',inhale?'수축 ↓':'이완 ↑'],['가슴우리 부피',inhale?'증가':'감소'],['폐 속 압력',inhale?'대기압보다 낮음':'대기압보다 높음']]:[['물의 재흡수',v===1?'증가':v===3?'감소':'보통'],['최종 오줌 양',v===1?'감소':v===3?'증가':'보통'],['오줌 농도',v===1?'진해짐':v===3?'묽어짐':'보통']]).map(a=>'<div class="stat"><span>'+a[0]+'</span><b>'+a[1]+'</b></div>').join('');$('explain').textContent=r?'폐는 스스로 근육처럼 수축하지 않아요. 호흡 근육이 가슴우리의 부피를 바꾸면 압력 차이 때문에 공기가 이동해요.':'세 과정은 실제 콩팥에서 동시에 일어납니다. 여기서는 이해를 위해 순서대로 강조해요. 수분 상태는 물의 재흡수와 최종 오줌에 영향을 줍니다.';$('question').textContent=r?'운동할 때 호흡이 빨라지면 어떤 점이 유리할까요?':'땀을 많이 흘리면 오줌 양은 왜 줄어들까요?';$('answer').textContent=r?'근육에 필요한 산소를 더 공급하고, 세포 호흡으로 생긴 이산화 탄소를 더 배출할 수 있어요.':'몸의 물을 보존하기 위해 물의 재흡수가 늘어나므로 오줌 양이 줄고 농도가 진해져요.'}setInterval(()=>{if(playing){phase=(phase+.1*(mode==='resp'?+$('amount').value:1))%3;render()}},180);switchMode('resp');
</script></html>
